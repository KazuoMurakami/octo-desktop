name: Ideia
description: Sugira uma melhoria ou recurso novo
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Qual problema isso resolve?
      description: Conte como você trabalha hoje e onde o Octo atrapalha ou falta algo.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Como você imagina a solução?
