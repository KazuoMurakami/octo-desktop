name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:desktop
      - name: O servidor sobe e protege a API
        env:
          OCTO_DATA_DIR: ${{ runner.temp }}/octo-ci
          OCTO_PORT: 4400
        run: |
          node server/index.ts > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4400/api/health && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4400/api/state)" = 401
          curl -sf -H "x-octo-token: $(cat "$OCTO_DATA_DIR/token")" http://127.0.0.1:4400/api/state > /dev/null
          curl -sf http://127.0.0.1:4400/ | grep -q '<div id="root">'
          cat server.log
